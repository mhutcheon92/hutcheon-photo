heroEyebrow: Elopements
heroTitle: Your Adventure
heroSub: The day that belongs to you.
heroLocation: Great Smoky Mountains, Tennessee
introText: >-
  An elopement is a day that belongs entirely to you. No audience, no schedule,
  no performance — just the two of you in a place that means something, doing
  exactly what you came to do. I love working with couples who've chosen that.
  The intimacy of it, the freedom of it, the fact that it can happen anywhere.
  My job is to stay out of the way of your day and bring back a record of what
  it actually felt like.
