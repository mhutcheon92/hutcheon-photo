expectEyebrow: What to Expect
expectTitle: How a day with me works.
expectSteps:
  - number: '01'
    title: Before
    text: >-
      Before anything else, we'll talk — about why you're doing it this way,
      what you want to feel when you look back at these images, and what will
      make this day yours. From there I handle all the creative logistics:
      location, light, timing. You'll receive a plan before the shoot so we're
      fully aligned going in. No surprises. Just a shared vision of the day
      ahead.
  - number: '02'
    title: The Day
    text: >-
      It's supposed to be fun. My job is to make sure you feel at ease so you
      can be exactly who you are — not a version of yourselves performing for a
      camera. I won't force stiff poses or put you anywhere uncomfortable. We'll
      execute what we planned together while staying flexible as the day
      unfolds. The best images come from people enjoying themselves, and that's
      always the goal.
  - number: '03'
    title: After
    text: >-
      Post-production is an art form in itself. I'll work through your images
      with the same care and intention as the shoot, and present you with a
      curated, edited gallery in a timely and organised fashion. What you
      receive will be a complete record of your day — sequenced, finished, and
      ready to keep forever.
pricingEyebrow: Investment
pricingTitle: >-
  Every package includes pre-shoot planning, full editing, and a delivered
  gallery.
pricingSub: The difference between them is time, distance, and how far you want to go.
ctaEyebrow: Elopements & Couples
ctaTitle: Planning something worth photographing?
ctaSub: I'd love to hear about it.
