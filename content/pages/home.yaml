aboutHeadline: "I'm Michael — based in Knoxville, originally from Forfar, Scotland."
aboutBody: >-
  I moved to the United States at nineteen on a soccer scholarship, met my wife
  at university, and eventually found my way to East Tennessee permanently.
  These pages are a record of what happened next.
