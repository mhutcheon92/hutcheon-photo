aboutHeadline: I'm Michael. Based in Knoxville, originally from Forfar, Scotland.
aboutBody: >-
  I moved to the United States at nineteen on a soccer scholarship, met my wife
  at university, and eventually landed in her neck of the woods in East
  Tennessee permanently. These pages are a record of our my adventures over the
  years.
