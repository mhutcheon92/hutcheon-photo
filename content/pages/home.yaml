heroTitle: Records of Life.
heroSub: I photograph records of life. My own, mostly. Sometimes yours.
heroLocation: The Quiraing | Isle of Skye, Scotland
heroBody: >-
  Have a look around. These pages are full of my own stories and a selection of
  others that I've had the privilege to capture. If you're planning something
  worth photographing, let's talk.
