heroImage:
  focal: center
heroEyebrow: Pricing
heroTitle: Your Adventure
heroSub: Transparent pricing. No surprises.
heroLocation: Great Smoky Mountains, Tennessee
introEyebrow: How It Works
introStatement: >-
  I price my work to reflect the time, travel, and care that goes into every
  shoot — not to maximize volume. These packages are designed to give you enough
  coverage without padding the day for the sake of it.
introBody: >-
  If you're not sure which package fits, reach out and we'll figure it out
  together. Most couples know what they want once we talk through the day.
packages:
  - name: Still
    price: $2,250
    description: >-
      Intentionally intimate. A focused session for couples who know exactly
      what they want. Up to half a day, one or two locations, and a curated
      gallery of 25–50 images. Intimate by design.
    features: |-
      Up to 4 hours of coverage
      One location, local to Knoxville
      Online delivery gallery
      25-50 images
      Personal-use license
  - name: Wandering
    price: $3,500
    description: >-
      Room to breathe. A full day to move at your own pace. It could include
      multiple locations with unhurried coverage from start to finish, and a
      curated gallery of 50–100 images.
    features: |-
      Up to a full day of coverage
      Multiple locations, regionally to Knoxville
      Online delivery gallery
      50-100 images
      Personal-use license
  - name: Boundless
    price: $5,500+
    description: >-
      Unlimited adventure. For the couples who want to go further. More than a
      day of adventure, anywhere you want to be; local, national, or
      international. A curated gallery of 100+ images. Note: travel and
      accommodation is not included.
    features: |-
      Multiple days of coverage
      Unlimited locations
      Online delivery gallery
      100+ images
      Personal-use license
alwaysIncluded:
  - >-
    A pre-shoot call to talk through the day, the locations, and what you're
    after
  - Full editing in my signature cinematic style — warm, lifted, unhurried
  - Online gallery delivered within four weeks via Pixieset
  - >-
    High-resolution downloads — no watermarks, no print restrictions for
    personal use
  - Permits for publicly accessible GSMNP areas where required
addOnsParagraph1: >-
  Extended travel (outside a 60-mile radius of Knoxville) is billed at cost,
  such as accommodation, transport, and a travel day where applicable. I'll
  always give you a clear estimate before anything is agreed.
addOnsParagraph2: >-
  Fine art prints and albums are available through Pixieset at standard lab
  pricing. Commercial or editorial licensing is available on request — reach out
  and we'll sort it.
ctaEyebrow: Get in Touch
ctaTitle: Ready to plan your adventure?
ctaSub: I'd love to hear about your day.
