heroEyebrow: Pricing
heroTitle: Your Adventure
heroSub: Transparent pricing. No surprises.
heroLocation: Great Smoky Mountains, Tennessee
introEyebrow: How It Works
introStatement: >-
  I price my work to reflect the time, travel, and care that goes into every
  shoot — not to maximize volume. These packages are designed to give you
  enough coverage without padding the day for the sake of it.
introBody: >-
  If you're not sure which package fits, reach out and we'll figure it out
  together. Most couples know what they want once we talk through the day.
packages:
  - name: Still
    price: "$2,500"
    description: >-
      For intimate ceremonies with a tight timeline — a ceremony, a portrait
      session, and the quiet moments in between. No audience required.
    featured: false
    features:
      - Up to 4 hours of coverage
      - One location
      - Online delivery gallery (Pixieset)
      - Full edited image set
      - Personal-use license
  - name: Wandering
    price: "$3,200"
    description: >-
      The day with room to breathe — two locations, a longer portrait session,
      and time to let things unfold the way they actually do.
    featured: true
    features:
      - Up to 6 hours of coverage
      - Up to two locations
      - Online delivery gallery (Pixieset)
      - Full edited image set
      - Personal-use license
      - Getting-ready coverage if desired
  - name: Boundless
    price: "$3,900"
    description: >-
      Full day. Multiple locations. The version for couples who want the whole
      story documented — from getting ready through to the last light.
    featured: false
    features:
      - Up to 8 hours of coverage
      - Unlimited locations
      - Online delivery gallery (Pixieset)
      - Full edited image set
      - Personal-use license
      - Getting-ready coverage
      - A second shooter (on request)
alwaysIncluded:
  - A pre-shoot call to talk through the day, the locations, and what you're after
  - Full editing in my signature cinematic style — warm, lifted, unhurried
  - Online gallery delivered within four weeks via Pixieset
  - High-resolution downloads — no watermarks, no print restrictions for personal use
  - Permits for publicly accessible GSMNP areas where required
addOnsParagraph1: >-
  Extended travel (outside a 60-mile radius of Knoxville) is billed at cost —
  accommodation, transport, and a travel day where applicable. I'll always give
  you a clear estimate before anything is agreed.
addOnsParagraph2: >-
  Fine art prints and albums are available through Pixieset at standard lab
  pricing. Commercial or editorial licensing is available on request — reach
  out and we'll sort it.
ctaEyebrow: Get in Touch
ctaTitle: Ready to plan your adventure?
ctaSub: I'd love to hear about your day.
