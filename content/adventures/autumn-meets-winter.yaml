body:
  - >-
    Since Fallon and I first met Sean in Charleston, he'd told us whimsical,
    fairytale like stories of his "Uncle" Bob's cabin in Vermont, doing his best
    to convince us that he should take us there. Neither of us needed much
    convincing but it took us the best part of almost a decade to finally plan
    the trip.
