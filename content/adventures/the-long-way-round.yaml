title: The Long Way Round
eyebrow: "Pisgah National Forest, North Carolina · Fall 2023"
sub: A loop we didn't plan. The kind that turns out to be the point.
gradient: "linear-gradient(155deg, #101820 0%, #18243a 45%, #14203a 100%)"
body:
  - >-
    We took a wrong turn somewhere around mile eight and didn't realise it for
    another two. By the time we worked it out we were committed — the smart
    move was to keep going and loop back the long way. It added four miles and
    about two hours and it was the best part of the trip.
  - >-
    Pisgah does something to you if you let it. The canopy is dense enough that
    the light only hits in patches, and in October those patches turn gold and
    you find yourself stopping every few minutes for reasons that are hard to
    explain to anyone who wasn't there.
