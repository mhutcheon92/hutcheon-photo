title: Still Water
eyebrow: "Douglas Lake, Tennessee · Summer 2024"
sub: An early morning on the lake with the kids. Nobody said much. Nobody needed to.
gradient: "linear-gradient(170deg, #0e1820 0%, #14222e 40%, #162430 100%)"
body:
  - >-
    We were on the water by six. The kids were half asleep and complaining about
    it until the moment they weren't — which happened right around when the mist
    started lifting off the surface and the first heron showed up on the far
    bank. After that they were quiet in the good way.
  - >-
    There's a version of Douglas Lake that most people know — the summer crowds,
    the boats, the noise. This is the other version. The one that's only
    available if you're willing to set an alarm and drive in the dark. Worth it
    every time.
