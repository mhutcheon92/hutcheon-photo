title: Laurel Falls with the Kids
eyebrow: "Laurel Falls, GSMNP · Spring 2023"
sub: Their first real hike. They didn't stop talking about it for a week.
gradient: "linear-gradient(170deg, #141e16 0%, #1c2c1e 45%, #162418 100%)"
body:
  - >-
    Laurel Falls is a paved trail. I want to be clear about that — it is a
    paved, maintained, genuinely accessible trail with very little elevation
    change and a waterfall at the end that is legitimately beautiful. It is also
    the first hike where my kids walked the whole thing without asking to be
    carried, which makes it one of my favourite hikes.
  - >-
    We went in late April when the rhododendrons were coming in and the crowds
    hadn't arrived yet. The kids ran ahead on the flat sections and slowed down
    exactly when the light got interesting. I don't know if they knew they were
    doing it. Either way, I got the shots I wanted and they got to say they
    hiked a real trail, and everyone went home happy.
