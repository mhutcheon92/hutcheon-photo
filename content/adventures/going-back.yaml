title: Going Back
eyebrow: "Forfar, Scotland · Summer 2023"
sub: Home looks different when you've been away long enough. I'm still deciding if that's good.
gradient: "linear-gradient(165deg, #161c24 0%, #1e2430 50%, #18202c 100%)"
body:
  - >-
    I grew up in Forfar, in Angus, which is the part of Scotland that people
    who visit Scotland don't usually visit. There's no particular reason to go
    there unless you're from there, and even then. I went back in the summer of
    2023 for the first time in three years and walked around for two days trying
    to figure out how to feel about it.
  - >-
    The light in Scotland is different from Tennessee. Softer, grayer, more
    diffuse — it doesn't pick sides the way southern light does. I photographed
    things I'd looked at a thousand times as a kid: the high street, the fields
    east of town, the park where nothing ever happened. I don't know what I was
    looking for. I'm glad I went.
