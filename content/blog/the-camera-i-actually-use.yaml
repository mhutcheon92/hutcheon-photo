title: The Camera I Actually Use
eyebrow: "Gear · March 2024"
sub: Not a review. More of a reckoning with gear culture and why I stopped upgrading.
gradient: "linear-gradient(170deg, #1e1a14 0%, #28241c 40%, #221e18 100%)"
body:
  - >-
    I've owned a lot of cameras. I've sold most of them. What I shoot with now is what I've
    shot with for the past three years and I don't have a particular plan to change. I'm not
    going to name the body here because that's not really the point — the point is that I
    stopped thinking about gear when I stopped believing that gear was the limiting factor in
    my photography, and I haven't looked back.
  - >-
    The gear conversation in photography circles is endless and mostly unproductive. Every
    upgrade promises something and delivers something slightly less than that. The images that
    matter to me from the past five years were made with three different camera bodies and a
    handful of lenses, and I genuinely could not tell you which body made which image without
    checking the EXIF data. What I can tell you is that the days I've come home with nothing
    worth keeping were never the camera's fault.
