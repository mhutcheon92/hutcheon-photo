title: The Smoky Mountains in October
eyebrow: "Places · October 2024"
sub: Peak colour is unpredictable and everybody chases it. Here is what I have learned about finding it.
gradient: "linear-gradient(140deg, #261e10 0%, #38280e 40%, #2a2210 100%)"
body:
  - >-
    Everyone knows October in the Smokies. The traffic, the parking lot queues at sunrise,
    the photographers lined up at the same overlook with the same lens pointed in the same
    direction. I've been one of them. I've also spent enough time in the park to know there's
    another version of October available if you're willing to give up the obvious spots.
  - >-
    Peak colour in the Smokies depends on elevation, rainfall, and temperature — a combination
    that's different every year and essentially impossible to predict more than a week out. The
    colour moves down from the high elevations, so Clingmans Dome goes first, then the
    mid-elevation ridges, then the valleys. If you plan around that gradient rather than a
    fixed date, you'll find colour across a three-to-four week window rather than chasing a
    single weekend. The trade-off is flexibility. The reward is usually better images and
    far fewer people.
