title: Learning to See
eyebrow: "Photography · September 2023"
sub: The thing nobody tells you about getting better at photography — and the one habit that changed how I work.
gradient: "linear-gradient(160deg, #1a1614 0%, #24201e 40%, #1e1c18 100%)"
body:
  - >-
    The standard advice for improving at photography is to shoot more. Take more pictures,
    review them, figure out what worked. That's not wrong but it's incomplete. Shooting more
    gives you more data points. It doesn't necessarily teach you to see better before you press
    the shutter. The habit that changed how I work was simpler and less obvious: I started
    going to places without my camera.
  - >-
    Not often — maybe once a month. I'd walk a trail or drive a route I photographed regularly
    and just look. No pressure to capture anything, no weight on my shoulder, no decisions to
    make. What I noticed was that I started seeing light differently. I'd clock an angle in
    late afternoon and come back the next week with the camera. I'd notice how a particular
    section of trail looked in fog and plan around it. The images didn't improve because I shot
    more. They improved because I started arriving at locations with a clearer idea of what I
    was looking for.
